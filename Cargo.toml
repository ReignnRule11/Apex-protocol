[workspace]
resolver = "2"
members = [
    "crates/apex-types",
    "crates/apex-codec",
    "crates/apex-consensus",
    "crates/apex-state",
    "crates/apex-state-redb",
    "crates/apex-lifecycle-redb",
    "crates/apex-lifecycle-witness",
    "crates/apex-lifecycle-witness-client",
    "crates/apex-commitments",
    "crates/apex-evm",
    "crates/apex-evm-redb",
    "crates/apex-node",
    "crates/apex-signer-safety",
    "crates/apex-signer-redb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.91.0"
authors = ["APEX Protocol Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
apex-types = { path = "crates/apex-types" }
redb = "=4.5.0"
sha2 = "=0.10.9"
sha2-11 = { package = "sha2", version = "=0.11.0" }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
