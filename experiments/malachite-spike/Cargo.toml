[package]
name = "apex-malachite-spike"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

# This directory is an independent Cargo workspace.
# Its lockfile is generated and retained as a CI artifact for dependency review.
[workspace]

[dependencies]
eyre = "0.6"
tokio = { version = "1", features = ["sync"] }

[dependencies.malachitebft-app-channel]
package = "arc-malachitebft-app-channel"
git = "https://github.com/circlefin/malachite"
rev = "a453b32155f4ba9f959724279b52f601bae92e09"
default-features = false

[dependencies.malachitebft-engine]
package = "arc-malachitebft-engine"
git = "https://github.com/circlefin/malachite"
rev = "a453b32155f4ba9f959724279b52f601bae92e09"
default-features = false

[dependencies.malachitebft-signing]
package = "arc-malachitebft-signing"
git = "https://github.com/circlefin/malachite"
rev = "a453b32155f4ba9f959724279b52f601bae92e09"
default-features = false

[dev-dependencies]
malachitebft-test = { package = "arc-malachitebft-test", git = "https://github.com/circlefin/malachite", rev = "a453b32155f4ba9f959724279b52f601bae92e09" }
rand = { version = "0.8.5", features = ["std_rng"] }
